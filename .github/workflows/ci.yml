name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  e2e:
    name: Browser call tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t earshot-server .
      - name: Smoke test the image
        run: |
          docker run -d --name earshot -p 8080:8080 earshot-server
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q Earshot

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install the Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Unit tests, lint and debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: earshot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  nightly:
    # A direct download for phones (Actions artifacts are zipped and need a
    # GitHub login). Debug-signed with the shared debug key, so each build
    # installs over the last.
    name: Nightly APK
    needs: [server, e2e, docker, android]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: earshot-debug-apk
          path: apk
      - name: Replace the rolling "nightly" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk earshot-debug.apk
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly earshot-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (debug build)" \
            --notes "Latest Android build of ${GITHUB_SHA::7}. On the phone: download earshot-debug.apk and open it (allow installing unknown apps for your browser). Installs over earlier nightly builds."
