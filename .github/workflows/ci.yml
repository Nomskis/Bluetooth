name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  e2e:
    name: Browser call tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t earshot-server .
      - name: Smoke test the image
        run: |
          docker run -d --name earshot -p 8080:8080 earshot-server
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q Earshot

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install the Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Unit tests, lint, and the debug and optimized APKs
        working-directory: android
        # Each run's number is the APK's version code, so every build installs as an update.
        run: ./gradlew -Pearshot.versionCode=${{ github.run_number }} :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleOptimized
      - uses: actions/upload-artifact@v5
        with:
          name: earshot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v5
        with:
          name: earshot-apk
          path: android/app/build/outputs/apk/optimized/*.apk
          retention-days: 30

  nightly:
    # A direct download for phones (Actions artifacts are zipped and need a
    # GitHub login), shown as the latest release on the repository's front
    # page. Signed with the shared debug key, so each build installs over the
    # last.
    name: Latest APK
    needs: [server, e2e, docker, android]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: earshot-apk
          path: apk
      - uses: actions/download-artifact@v5
        with:
          name: earshot-debug-apk
          path: apk-debug
      - name: Replace the rolling "nightly" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk earshot.apk
          cp apk-debug/*.apk earshot-debug.apk
          cat > notes.md <<NOTES
          Android build ${{ github.run_number }} (${GITHUB_SHA::7}).

          **On the phone:** download **earshot.apk** below and open it (allow installing unknown apps for your browser when asked). It installs over any earlier Earshot build, keeping your settings and contacts.

          - **earshot.apk**: the one to use. Optimized, for the smoothest calls.
          - **earshot-debug.apk**: the same app with debugging on, slower. Only for troubleshooting, or for a test server on plain http (no https) on your own Wi-Fi.
          NOTES
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly earshot.apk earshot-debug.apk \
            --latest \
            --target "$GITHUB_SHA" \
            --title "Earshot for Android (build ${{ github.run_number }})" \
            --notes-file notes.md
