# One-click hosting on Render (https://render.com): New > Blueprint, pick this
# repository, done. The free plan sleeps when idle, so the first call after a
# while takes about a minute to connect; a paid instance doesn't.
#
# Optional relay for networks that block direct calls (mobile data, gym
# Wi-Fi): after the first deploy, open the service's Environment tab and add
# CLOUDFLARE_TURN_KEY_ID and CLOUDFLARE_TURN_API_TOKEN (see docs/deploy.md).
# They aren't listed here because Render would ask for them during setup.
#
# Region: Render uses oregon unless told otherwise. For callers in Europe or
# Africa, add `region: frankfurt` below before the first deploy (it can't be
# changed afterwards; docs/deploy.md says how to move an existing service).
services:
  - type: web
    name: earshot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
